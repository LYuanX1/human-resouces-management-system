<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>个人指挥中心 - 三角洲行动</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- 1. 全局基础 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; font-family: "Microsoft YaHei", sans-serif; overflow-x: hidden; }
        body { background-color: #0b1013; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
        #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; width: auto; height: auto; z-index: -100; object-fit: cover; filter: brightness(0.4); }

        /* --- 2. 导航栏 (保持与其他页面一致) --- */
        .navbar { width: 100%; height: 90px; background-color: #1F2D35; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; position: fixed; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .nav-left .logo-img { height: 65px; width: auto; display: block; }
        .nav-right { display: flex; align-items: center; gap: 25px; margin-left: auto; }
        .nav-item { text-decoration: none; font-size: 16px; color: #9D9E9E; transition: color 0.3s; font-weight: 500; }
        .nav-item:hover, .nav-item.active { color: #fff; }

        /* 导航栏头像 */
        .user-menu-container { position: relative; margin-left: 35px; padding-bottom: 10px; top: 5px; }
        /* 注意：这里读取的是 sessionScope.user.avatar */
        .user-avatar-nav { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #28a745; background-color: #000; cursor: pointer; transition: transform 0.2s; }
        .user-menu-container:hover .user-avatar-nav { transform: scale(1.1); }
        .user-dropdown { display: none; position: absolute; top: 55px; right: -10px; width: 140px; background: rgba(31, 45, 53, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; flex-direction: column; z-index: 9999; }
        .user-menu-container:hover .user-dropdown { display: flex; animation: slideDown 0.2s ease-out; }
        .dropdown-item { padding: 12px 20px; color: #ccc; text-decoration: none; font-size: 14px; transition: background 0.2s; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .dropdown-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .dropdown-item.logout { color: #ff6b6b; }

        /* --- 3. 个人中心主布局 --- */
        .main-container { margin-top: 120px; width: 80%; max-width: 1000px; margin-left: auto; margin-right: auto; padding-bottom: 50px; flex: 1; display: flex; align-items: flex-start; gap: 50px; }

        /* 左侧头像区域 */
        .profile-left { display: flex; flex-direction: column; align-items: center; width: 250px; }
        .profile-avatar-lg { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 4px solid #28a745; box-shadow: 0 0 30px rgba(40, 167, 69, 0.3); background: #000; margin-bottom: 20px; }
        .modify-btn { background: transparent; border: 1px solid #28a745; color: #28a745; padding: 10px 30px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .modify-btn:hover { background: #28a745; color: #fff; box-shadow: 0 0 15px #28a745; }

        /* 右侧信息区域 */
        .profile-right { flex: 1; padding-top: 20px; }
        .profile-header { display: flex; align-items: flex-end; gap: 15px; margin-bottom: 15px; }
        .profile-name { font-size: 48px; font-weight: bold; color: #fff; line-height: 1; }

        .level-container { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .level-label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .level-box { background: linear-gradient(45deg, #d4af37, #f7e08b); color: #000; padding: 2px 8px; border-radius: 4px; font-weight: 900; font-size: 14px; font-family: 'Consolas', sans-serif; box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }

        .profile-signature { font-size: 16px; color: #ccc; margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-left: 3px solid #28a745; border-radius: 0 8px 8px 0; max-width: 600px; line-height: 1.6; }

        /* --- 4. 修改弹窗样式 (核心需求) --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { width: 450px; background: #1F2D35; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); padding: 40px 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; text-align: center; }

        /* 弹窗内的头像上传器 */
        .upload-container { width: 120px; height: 120px; margin: 0 auto 25px auto; position: relative; border-radius: 50%; overflow: hidden; cursor: pointer; border: 3px solid rgba(255,255,255,0.2); }
        .upload-img { width: 100%; height: 100%; object-fit: cover; }

        /* 灰色遮罩层 */
        .upload-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; background: rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; justify-content: center; align-items: center; transition: height 0.3s; }
        .upload-container:hover .upload-overlay { height: 50%; background: rgba(0, 0, 0, 0.8); }
        .upload-icon { color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 2px; }
        .upload-text { color: #ddd; font-size: 10px; transform: scale(0.9); }

        /* 表单样式 */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-label { display: block; margin-bottom: 8px; font-size: 12px; color: #888; }
        .form-input { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; outline: none; font-size: 14px; text-align: center; }
        .form-input:focus { border-color: #28a745; background: rgba(0,0,0,0.5); }

        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn { flex: 1; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; border: none; transition: all 0.2s; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }
        .btn-confirm { background: #28a745; color: #fff; }
        .btn-confirm:hover { background: #218838; }

        .footer-copyright { text-align: center; color: rgba(255, 255, 255, 0.3); font-size: 12px; padding: 30px 0; width: 100%; flex-shrink: 0; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<video autoplay muted loop id="bg-video">
    <source src="https://env-00jy736zuxjd.normal.cloudstatic.cn/hrms/bg_video.mp4" type="video/mp4">
</video>

<nav class="navbar">
    <div class="nav-left"><img src="https://env-00jy736zuxjd.normal.cloudstatic.cn/hrms/logo_bg.png" alt="Logo" class="logo-img"></div>
    <div class="nav-right">
        <a href="main.html" class="nav-item">首页</a>
        <a href="info.html" class="nav-item">人事管理</a>
        <a href="mission.html" class="nav-item">任务派遣</a>
        <a href="finance.html" class="nav-item">财务报销</a>
        <a href="material.html" class="nav-item">物资申领</a>
        <a href="attendance.html" class="nav-item">考勤打卡</a>
        <a href="#" class="nav-item">社区中心</a>
        <a href="#" class="nav-item">帮助</a>
        <div class="user-menu-container">
            <img src="" data-avatar="1"
                 class="user-avatar-nav" onclick="location.href='mine.html'">
            <div class="user-dropdown">
                <a href="mine.html" class="dropdown-item">👤 个人中心</a>
                <a href="#" class="dropdown-item">⚙️ 系统设置</a>
                <a href="index.html" class="dropdown-item logout">🛑 退出登录</a>
            </div>
        </div>
    </div>
</nav>

<div class="main-container">

    <div class="profile-left">
        <img src="" data-avatar="1"
             class="profile-avatar-lg">
        <button class="modify-btn" onclick="openModal()">修改资料</button>
    </div>

    <div class="profile-right">
        <div class="profile-header">
            <div class="profile-name" id="profileName">--</div>
            <div class="level-container">
                <span class="level-label">权限等级</span>
                <div class="level-box">Lv5</div>
            </div>
        </div>

        <div style="font-size: 14px; color: #888; margin-bottom: 15px;">
            ID: <span id="profileId">--</span> &nbsp;|&nbsp; 性别: <span id="profileGender">--</span>
        </div>

        <div class="profile-signature">
            “ <span id="profileSignature">--</span> ”
        </div>
    </div>
</div>

<div class="footer-copyright">
    COPYRIGHT © 2024-2025 LRB&HJM. ALL RIGHTS RESERVED
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <form action="#updateUser" method="post" enctype="multipart/form-data" id="profileForm">

            <div class="upload-container" onclick="document.getElementById('fileInput').click()">
                <img id="previewImg" class="upload-img"
                     src="" data-avatar="1">
                <div class="upload-overlay">
                    <div class="upload-icon">+</div>
                    <div class="upload-text">上传照片</div>
                </div>
            </div>
            <input type="file" name="avatarFile" id="fileInput" style="display:none;" accept="image/*" onchange="previewFile(this)">
            <input type="hidden" name="oldAvatar" value="">

            <div class="form-group">
                <input type="text" name="username" class="form-input" value="" placeholder="管理员名字">
            </div>

            <div class="form-group">
                <select name="gender" class="form-input" style="cursor: pointer;">
                    <option value="男" >男</option>
                    <option value="女" >女</option>
                </select>
            </div>

            <div class="form-group">
                <input type="text" name="signature" class="form-input" value="" placeholder="个性签名">
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-cancel" onclick="closeModal()">取消修改</button>
                <button type="submit" class="btn btn-confirm">确认修改</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openModal() {
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    // 头像预览逻辑
    function previewFile(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImg').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 点击遮罩关闭
    window.onclick = function(event) {
        if (event.target == document.getElementById('editModal')) {
            closeModal();
        }
    }
</script>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/mine.js"></script>
</body>
</html>
